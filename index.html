  <style>
    :root {
      --bg-color: #0d0f17;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --primary-accent: #7928ca;
      --secondary-accent: #00dfd8;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 2rem;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--secondary-accent), var(--primary-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* 包含生成器卡片的区域，用于整体截屏导出 */
    #capture-area {
      background: var(--bg-color);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
    }

    .generator-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .part-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .part-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--secondary-accent);
      transform: translateY(-1px);
    }

    .part-card:active {
      transform: translateY(0);
    }

    .part-name {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .part-name::before {
      content: '✦';
      color: var(--secondary-accent);
      font-size: 0.8rem;
    }

    .part-value {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--secondary-accent);
      min-height: 24px;
    }

    .part-value.empty {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: normal;
      font-style: italic;
    }

    /* 底部按钮区域 */
    .actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-accent), #4f46e5);
      color: #fff;
    }

    .btn-primary:hover {
      opacity: 0.9;
      box-shadow: 0 4px 20px rgba(121, 40, 202, 0.4);
    }
  </style>
</head>

    // 随机获取一个动物
    function getRandomCreature() {
      const randomIndex = Math.floor(Math.random() * creatures.length);
      return creatures[randomIndex];
    }

    // 生成单个部位的动物
    function generatePart(partId) {
      const element = document.getElementById(`val-${partId}`);
      element.textContent = getRandomCreature();
      element.classList.remove('empty');
    }

    // 重置所有部位
    function resetAll() {
      const parts = ['base', 'head', 'ears', 'eyes', 'nose', 'legs', 'feets', 'tail', 'coat' , 'color' , 'extra'];
      parts.forEach(part => {
        const element = document.getElementById(`val-${part}`);
        element.textContent = '点击生成...';
        element.classList.add('empty');
      });
    }

    // 导出为图片
    function saveAsPicture() {
      const captureArea = document.getElementById('capture-area');
      
      html2canvas(captureArea, {
        backgroundColor: '#0d0f17', // 保证导出图片的背景一致
        scale: 2 // 提高导出图片的清晰度
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `creature-inspiration-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
